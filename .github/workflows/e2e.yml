name: E2E Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    name: Run E2E Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache FastEmbed model (avoid HF 429 rate limits)
        uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache_shared
          key: fastembed-cache-${{ runner.os }}-v1

      - name: Configure Git identity
        run: |
          git config --global user.email "ci@knot-server.local"
          git config --global user.name "knot-server CI"
          git config --global init.defaultBranch master

      - name: Run E2E Test Suite
        run: ./tests/run_all_e2e.sh
