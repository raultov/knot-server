[package]
name = "knot-server"
version = "0.3.6"
edition = "2024"
description = "Distributed REST API server for knot codebase indexing. Manages Git repositories across a cluster with shared workspace coordination."
authors = ["Raul Tovar <raultov@protonmail.com>"]
license = "MIT"
repository = "https://github.com/raultov/knot-server"
# The animated demo WebPs live on GitHub (where the README renders them)
# but push the crate over crates.io's 10 MiB publish limit. Exclude them
# from the package tarball while keeping them in the repo.
exclude = ["docs/demo-graph.webp", "docs/demo-swagger.webp"]

[lints.rust]
# Enforces the no-unsafe policy stated in AGENTS.md. `deny` rather than
# `forbid`; `deny` still blocks new unsafe while allowing documented,
# audited exceptions via `#[expect(unsafe_code, reason = "...")]`.
unsafe_code = "deny"

[lints.clippy]
# Readability gates. Thresholds live in clippy.toml; these lints are
# allow-by-default (pedantic/nursery), so they are inert without this.
too_many_lines = "warn"
cognitive_complexity = "warn"

# Ban bare `#[allow]` in favour of `#[expect(..., reason = "...")]`, which
# warns once the suppression is no longer needed. This keeps the refactor
# backlog self-cleaning instead of accumulating stale opt-outs.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
knot = "1.8.1"
ignore = "0.4"
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
fs2 = "0.4"
rayon = "1"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
neo4rs = "0.9.0-rc.10"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
metrics-util = "0.19"
