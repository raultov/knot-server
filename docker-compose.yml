version: '3.8'

services:
  knot-server:
    build: .
    ports:
      - "3000:3000"
    environment:
      - KNOT_SERVER_PORT=3000
      - KNOT_SERVER_QDRANT_URL=http://qdrant:6334
      - KNOT_SERVER_NEO4J_URI=bolt://neo4j:7687
      - KNOT_SERVER_NEO4J_USER=neo4j
      - KNOT_NEO4J_PASSWORD=knotsecret
      - KNOT_WORKSPACE_DIR=/var/lib/knot/repos
      - KNOT_SERVER_POLL_INTERVAL_SECS=86400
      - KNOT_SERVER_STALE_LOCK_TIMEOUT_SECS=3600
      - KNOT_SERVER_MAX_INDEX_AGE_SECS=86400
      - RUST_LOG=info
    volumes:
      - knot_workspace:/var/lib/knot/repos
      - ~/.ssh:/root/.ssh:ro
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/knotsecret
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "knotsecret", "CALL db.ping()"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  knot_workspace:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
